[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers_custom.conf

[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

# Las líneas JSON del proxy se convierten en campos consultables.
# Los logs de Spring Boot se conservan como texto junto con los
# metadatos del contenedor.
[FILTER]
    Name         parser
    Match        *web*
    Key_Name     log
    Parser       nginx_json
    Reserve_Data On
    Preserve_Key On

[OUTPUT]
    Name               es
    Match              *
    Host               elasticsearch
    Port               9200
    Logstash_Format    On
    Logstash_Prefix    escaparate
    Suppress_Type_Name On
    Generate_ID        On
    Retry_Limit        False

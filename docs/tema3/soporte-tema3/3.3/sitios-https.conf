upstream backend_pool {
    zone backend_pool 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server app-1:8080 resolve;
    server app-2:8080 resolve;
    server app-3:8080 resolve;
}
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    server_name escaparate.* docs.*;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    server_name escaparate.*;
    ssl_certificate /etc/letsencrypt/live/daw-sesion08/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daw-sesion08/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    root /srv/www/escaparate;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json;
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~* \.(css|js|png|jpg|jpeg|svg|webp)$ {
        expires 7d;
        try_files $uri =404;
    }
}
server {
    listen 443 ssl;
    server_name docs.*;
    ssl_certificate /etc/letsencrypt/live/daw-sesion08/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daw-sesion08/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    root /srv/www/docs;
    index index.html;
    location /informes/ {
        autoindex on;
        auth_basic "Zona restringida";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
    }
}

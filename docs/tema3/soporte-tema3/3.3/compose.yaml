services:
  bd:
    image: ${IMAGEN_BD:?define IMAGEN_BD}
    environment:
      POSTGRES_USER: ${BD_USUARIO:?define BD_USUARIO}
      POSTGRES_DB: ${BD_NOMBRE:?define BD_NOMBRE}
      POSTGRES_PASSWORD_FILE: /run/secrets/bd_clave
    secrets:
      - bd_clave
    volumes:
      - datos-bd:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
  app-1:
    image: ${IMAGEN_APP:?define IMAGEN_APP}
    environment:
      DB_HOST: bd
      DB_PORT: "5432"
      DB_NAME: ${BD_NOMBRE}
      DB_USER: ${BD_USUARIO}
      SPRING_CONFIG_IMPORT: "configtree:/run/secrets/"
      APP_INSTANCE_NAME: app-1
      APP_STORAGE_TYPE: filesystem
      APP_STORAGE_PATH: /data/uploads
    secrets:
      - source: bd_clave
        target: spring.datasource.password
    depends_on:
      bd:
        condition: service_healthy
    volumes:
      - imagenes-compartidas:/data/uploads
  app-2:
    image: ${IMAGEN_APP:?define IMAGEN_APP}
    environment:
      DB_HOST: bd
      DB_PORT: "5432"
      DB_NAME: ${BD_NOMBRE}
      DB_USER: ${BD_USUARIO}
      SPRING_CONFIG_IMPORT: "configtree:/run/secrets/"
      APP_INSTANCE_NAME: app-2
      APP_STORAGE_TYPE: filesystem
      APP_STORAGE_PATH: /data/uploads
    secrets:
      - source: bd_clave
        target: spring.datasource.password
    depends_on:
      bd:
        condition: service_healthy
    volumes:
      - imagenes-compartidas:/data/uploads
  app-3:
    image: ${IMAGEN_APP:?define IMAGEN_APP}
    environment:
      DB_HOST: bd
      DB_PORT: "5432"
      DB_NAME: ${BD_NOMBRE}
      DB_USER: ${BD_USUARIO}
      SPRING_CONFIG_IMPORT: "configtree:/run/secrets/"
      APP_INSTANCE_NAME: app-3
      APP_STORAGE_TYPE: filesystem
      APP_STORAGE_PATH: /data/uploads
    secrets:
      - source: bd_clave
        target: spring.datasource.password
    depends_on:
      bd:
        condition: service_healthy
    volumes:
      - imagenes-compartidas:/data/uploads
  web:
    image: nginx:1.30.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/sitio-escaparate/escaparate:/srv/www/escaparate:ro
      - ../nginx/sitio-docs:/srv/www/docs:ro
      - ../nginx/auth/.htpasswd:/etc/nginx/auth/.htpasswd:ro
      - ../nginx/certbot/www:/var/www/certbot:ro
      - ../nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app-1
      - app-2
      - app-3
  certbot:
    image: certbot/certbot
    profiles: [tools]
    volumes:
      - ../nginx/certbot/www:/var/www/certbot
      - ../nginx/certbot/conf:/etc/letsencrypt

volumes:
  datos-bd:
  imagenes-compartidas:

secrets:
  bd_clave:
    file: ./secrets/bd_clave.txt

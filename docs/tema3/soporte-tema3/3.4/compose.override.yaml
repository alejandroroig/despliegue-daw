x-fluent-logging: &fluent-logging
  driver: fluentd
  options:
    fluentd-address: "127.0.0.1:24224"
    fluentd-async: "true"
    tag: "{{.Name}}"

services:
  web:
    logging: *fluent-logging

  app-1:
    logging: *fluent-logging

  app-2:
    logging: *fluent-logging

  app-3:
    logging: *fluent-logging

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:4.2.3
    ports:
      - "127.0.0.1:24224:24224"
    volumes:
      - ../observabilidad/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ../observabilidad/fluent-bit/parsers.conf:/fluent-bit/etc/parsers_custom.conf:ro
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms384m -Xmx384m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - datos-elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.2
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      NODE_OPTIONS: "--max-old-space-size=768"
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  kibana-init:
    image: curlimages/curl:8.16.0
    depends_on:
      kibana:
        condition: service_started
    volumes:
      - ../observabilidad/kibana-init.sh:/kibana-init.sh:ro
    entrypoint: ["/bin/sh", "/kibana-init.sh"]
    restart: "no"

volumes:
  datos-elasticsearch:

server {
    listen 80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    server_name escaparate.*;
    root /srv/www/escaparate;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json;
    location /api/ {
        proxy_pass http://app:8080;
    }
    location ~* \.(css|js|png|jpg|jpeg|svg|webp)$ {
        expires 7d;
        try_files $uri =404;
    }
}
server {
    listen 80;
    server_name docs.*;
    root /srv/www/docs;
    index index.html;
    location /informes/ {
        autoindex on;
    }
}

spring:
  application:
    name: escaparate

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:escaparate}
    username: ${DB_USER:escaparate}
    password: ${DB_PASSWORD:escaparate}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}

app:
  version: ${APP_VERSION:@project.version@}
  instance:
    name: ${APP_INSTANCE_NAME:}
  storage:
    type: ${APP_STORAGE_TYPE:filesystem}
    path: ${APP_STORAGE_PATH:./uploads}
  health:
    db-timeout-seconds: ${APP_HEALTH_DB_TIMEOUT_SECONDS:2}
  load:
    max-ms: ${APP_LOAD_MAX_MS:5000}

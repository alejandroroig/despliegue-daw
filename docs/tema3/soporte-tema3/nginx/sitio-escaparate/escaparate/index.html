<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Escaparate</title>
    <link rel="stylesheet" href="./css/app.css">
</head>
<body>
<header class="cabecera">
    <div class="contenedor cabecera-interior">
        <div>
            <div class="marca-linea">
                <p class="marca">ESCAPARATE</p>
                <span id="version-visible" class="version-visible" hidden></span>
            </div>
            <h1>Objetos para trabajar y crear</h1>
            <p class="subtitulo">El mismo catálogo, preparado para evolucionar con su infraestructura.</p>
        </div>
        <button id="mostrar-formulario" class="boton boton-claro" type="button">+ Producto</button>
    </div>
</header>

<main class="contenedor">
    <section id="panel-formulario" class="panel-formulario oculto" aria-labelledby="titulo-formulario">
        <div class="panel-cabecera">
            <div>
                <p class="etiqueta">NUEVO PRODUCTO</p>
                <h2 id="titulo-formulario">Añadir al escaparate</h2>
            </div>
            <button id="cerrar-formulario" class="boton-icono" type="button" aria-label="Cerrar formulario">×</button>
        </div>

        <form id="formulario-producto" enctype="multipart/form-data">
            <div class="campos">
                <label>
                    <span>Nombre *</span>
                    <input name="nombre" maxlength="120" required>
                </label>
                <label>
                    <span>Precio</span>
                    <input name="precio" type="number" min="0" step="0.01" value="0">
                </label>
                <label class="campo-ancho">
                    <span>Descripción</span>
                    <textarea name="descripcion" maxlength="500" rows="3"></textarea>
                </label>
                <label class="campo-ancho">
                    <span>Imagen</span>
                    <input name="imagen" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
                    <small>JPG, PNG, WEBP o GIF. Máximo 5 MB.</small>
                </label>
            </div>
            <div class="acciones-formulario">
                <p id="mensaje-formulario" class="mensaje-formulario" aria-live="polite"></p>
                <button class="boton boton-primario" type="submit">Guardar producto</button>
            </div>
        </form>
    </section>

    <section class="titulo-seccion">
        <div>
            <p class="etiqueta">CATÁLOGO</p>
            <h2>Productos disponibles</h2>
        </div>
        <p id="estado" class="estado">Cargando…</p>
    </section>

    <section id="productos" class="rejilla" aria-live="polite"></section>

    <section id="panel-tecnico" class="panel-tecnico" aria-labelledby="titulo-tecnico">
        <div>
            <p class="etiqueta">DESPLIEGUE</p>
            <h2 id="titulo-tecnico">Información de la instancia</h2>
        </div>
        <dl class="datos-tecnicos">
            <div>
                <dt>Instancia</dt>
                <dd id="dato-instancia">Cargando…</dd>
            </div>
            <div>
                <dt>Versión</dt>
                <dd id="dato-version">Cargando…</dd>
            </div>
            <div>
                <dt>Almacenamiento</dt>
                <dd id="dato-almacenamiento">Cargando…</dd>
            </div>
        </dl>
    </section>
</main>

<template id="plantilla-producto">
    <article class="tarjeta">
        <div class="zona-imagen">
            <div class="imagen-placeholder">Sin imagen</div>
            <img class="imagen-producto" alt="" hidden>
        </div>
        <div class="contenido-tarjeta">
            <h3 class="nombre"></h3>
            <p class="descripcion"></p>
            <div class="pie-tarjeta">
                <p class="precio"></p>
                <button class="boton-eliminar" type="button">Eliminar</button>
            </div>
        </div>
    </article>
</template>

<script src="./config.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
